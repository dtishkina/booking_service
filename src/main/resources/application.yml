spring:
  datasource:
    url: jdbc:postgresql://localhost:55432/bookingdb
    username: booking_user
    password: booking_pass

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate.format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.liquibase: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui

app:
  jwt:
    secret: "super_secret_key_for_jwt_must_be_long_enough_123"
    expiration-ms: 3600000

booking:
  min-duration-minutes: 30
  max-duration-hours: 8
  max-booking-days-ahead: 30

